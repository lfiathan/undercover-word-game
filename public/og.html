<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(ellipse at 30% 0%, #241a4d, #0d0820 55%, #080515);
    font-family: Inter, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(110px); }
  .o1 { width: 520px; height: 520px; background: rgba(139,92,246,.42); left: -120px; top: -160px; }
  .o2 { width: 460px; height: 460px; background: rgba(232,86,201,.32); right: -100px; top: 120px; }
  .o3 { width: 420px; height: 420px; background: rgba(34,211,238,.20); left: 38%; bottom: -220px; }
  .wrap { position: relative; text-align: center; padding: 0 80px; }
  .badge {
    width: 104px; height: 104px; margin: 0 auto 34px; border-radius: 28px;
    background: linear-gradient(135deg, #8b5cf6, #e856c9);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 70px -18px rgba(139,92,246,.95);
  }
  h1 {
    font-family: Outfit, sans-serif; font-weight: 800; font-size: 104px; line-height: 1;
    letter-spacing: .16em; text-indent: .16em; margin-bottom: 26px;
    background: linear-gradient(100deg, #fff 20%, #d8c9ff 55%, #96e9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.tag { font-size: 32px; font-weight: 500; color: rgba(255,255,255,.72); margin-bottom: 40px; }
  .pills { display: flex; gap: 14px; justify-content: center; }
  .pill {
    font-size: 22px; font-weight: 500; color: rgba(255,255,255,.80);
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    padding: 12px 26px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="wrap">
    <div class="badge">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 11c-1.5 0-2.5.5-3 2"/>
        <path d="M6 11c1.5 0 2.5.5 3 2"/>
        <path d="M2 9c0-3 1.5-5 4-5 2 0 3.5 1 6 1s4-1 6-1c2.5 0 4 2 4 5 0 6-4 11-10 11S2 15 2 9Z"/>
      </svg>
    </div>
    <h1>UNDERCOVER</h1>
    <p class="tag">One word. One impostor. Find them before they find you.</p>
    <div class="pills">
      <span class="pill">No app</span>
      <span class="pill">No sign-up</span>
      <span class="pill">Just a 6-letter code</span>
    </div>
  </div>
</body>
</html>
