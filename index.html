<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0718" />
    <title>Undercover</title>
    <meta name="description" content="The Undercover social deduction word game, playable with friends anywhere." />
    <!-- __SITE_URL__ is replaced with the deployment's absolute URL by the
         deploy workflow: link previews need absolute URLs, and only CI knows
         where this build is going to live. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Undercover" />
    <meta property="og:description" content="Find the impostor. Play with friends from anywhere, no app and no sign-up." />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Undercover" />
    <meta name="twitter:description" content="Find the impostor. Play with friends from anywhere, no app and no sign-up." />
    <meta name="twitter:image" content="__SITE_URL__og-image.jpg" />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
