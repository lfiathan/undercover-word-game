name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # A GitHub Pages project site is served from /<repo>/, a user/org site
        # or a custom domain from /. Detect which one this repo is.
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ -f public/CNAME ]; then
            export BASE_PATH="/"
            SITE_URL="https://$(tr -d '[:space:]' < public/CNAME)/"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            export BASE_PATH="/"
            SITE_URL="https://$OWNER.github.io/"
          else
            export BASE_PATH="/$REPO/"
            SITE_URL="https://$OWNER.github.io/$REPO/"
          fi
          echo "Building with BASE_PATH=$BASE_PATH and SITE_URL=$SITE_URL"
          npm run build
          # Link previews need absolute URLs, which only CI knows.
          sed -i "s|__SITE_URL__|$SITE_URL|g" dist/index.html

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload production-ready build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
